version: "1.0.0"
default_profile: "edge_laptop_6gb"

profiles:
  edge_laptop_6gb:
    name: "Edge Laptop (6GB GDDR6)"
    description: "Standard mid-range workstation/laptop (NVIDIA RTX 3050 / RTX 4050 6GB VRAM)"
    total_vram_mb: 6144
    os_overhead_mb: 400
    kv_cache_headroom_mb: 600
    safe_vram_ceiling_mb: 6000
    max_concurrent_active_models: 2
    eviction_strategy: "lru_swap"
    supported_backends:
      - "laptop_gpu"
      - "ollama"

  workstation_24gb_rtx4090:
    name: "Engineering Workstation (24GB GDDR6X)"
    description: "High-end on-premise CAD/Simulation station (NVIDIA RTX 4090 / RTX 6000 Ada 24GB)"
    total_vram_mb: 24576
    os_overhead_mb: 1024
    kv_cache_headroom_mb: 2048
    safe_vram_ceiling_mb: 23500
    max_concurrent_active_models: 4
    eviction_strategy: "lru_swap"
    supported_backends:
      - "workstation_gpu"
      - "ollama"
      - "vllm"

  enterprise_cluster_80gb_a100:
    name: "Enterprise GPU Cluster (80GB HBM2e A100/H100)"
    description: "Data-center grade sovereign refinery AI server (NVIDIA A100/H100 80GB SXM4)"
    total_vram_mb: 81920
    os_overhead_mb: 2048
    kv_cache_headroom_mb: 8192
    safe_vram_ceiling_mb: 78000
    max_concurrent_active_models: 16
    eviction_strategy: "all_resident"
    supported_backends:
      - "cluster_gpu"
      - "vllm"
      - "vllm_cluster"
      - "ray_distributed"
      - "tgi"
      - "ollama"
    vllm_endpoint: "http://10.0.0.100:8000/v1"
    vllm_host: "10.0.0.100"
    vllm_port: 8000

  cpu_ram_edge:
    name: "Air-Gapped CPU / System RAM Edge"
    description: "Ruggedized industrial edge box or low-power control room node (32GB Unified System RAM)"
    total_vram_mb: 32768
