version: "1.0.0"
environment: "airgapped_onpremise"
facility: "Mangalore Refinery and Petrochemicals Limited (MRPL)"
security_level: "DEFENSE_AIRGAP_RESTRICTED"

pki:
  enabled: true
  ca_cert_path: "apps/admin_backend/config/certs/mrpl_root_ca.crt"
  root_ca_path: "apps/admin_backend/config/certs/mrpl_root_ca.crt"
  crl_path: "apps/admin_backend/config/certs/mrpl_crl.pem"
  enforce_expiration: true
  enforce_crl: true
  client_cert_header: "X-SSL-Client-Cert"
  allowed_issuers:
    - "MRPL Plant Root CA"
    - "MRPL Sovereign Security Sub-CA"
    - "ONGC Group Enterprise CA"
  allowed_organizations:
    - "MRPL"
    - "ONGC"
    - "Mangalore Refinery and Petrochemicals Limited"
  auto_generate_plant_ca_if_missing: true

ldap:
  enabled: true
  server_uri: "ldap://127.0.0.1:389"
  use_ssl: false
  start_tls: false
  connect_timeout_sec: 2.0
  bind_dn: "CN=SvcWorkbench,OU=ServiceAccounts,DC=mrpl,DC=internal"
  bind_password: "SovereignPlantServicePass2026!"
  base_dn: "dc=mrpl,dc=internal"
  user_search_filter: "(&(objectClass=user)(sAMAccountName={username}))"
  group_search_base: "OU=Groups,DC=mrpl,DC=internal"
  group_role_mapping:
    "CN=MRPL_SEC_ADMINS,OU=Groups,DC=mrpl,DC=internal": "SUPER_ADMIN"
    "CN=MRPL_PROCESS_LEADS,OU=Groups,DC=mrpl,DC=internal": "PROCESS_LEAD"
    "CN=MRPL_HSE_AUDITORS,OU=Groups,DC=mrpl,DC=internal": "HSE_AUDITOR"
    "CN=MRPL_OPERATORS,OU=Groups,DC=mrpl,DC=internal": "FIELD_OPERATOR"
    "CN=MRPL_PLANT_SECURITY": "PLANT_SECURITY_OFFICER"
    "CN=MRPL_MAINTENANCE": "MAINTENANCE_ENG"
  fallback_to_local_db: true

jwt:
  algorithm: "HS256"
  secret_key: "sovereign-mrpl-industrial-pki-hmac-sha256-secret-key-airgap-2026"
  token_expiry_minutes: 480 # 8-hour shift duration
  token_expiry_seconds: 28800
  issuer: "MRPL_SOVEREIGN_AUTH_ENGINE"
  audience: "MRPL_SOVEREIGN_WORKBENCH"

rbac:
  default_role: "FIELD_OPERATOR"
  roles:
    - "SUPER_ADMIN"
    - "PLANT_SECURITY_OFFICER"
    - "PROCESS_LEAD"
    - "MAINTENANCE_ENG"
    - "HSE_AUDITOR"
    - "FIELD_OPERATOR"
    - "READONLY_OPERATOR"
  role_hierarchy:
    SUPER_ADMIN:
      - "rag:query"
      - "rag:reindex_global"
      - "sandbox:override_ast"
      - "deliverables:export"
      - "sovereignty:tamper_read"
      - "models:swap_engine"
      - "users:manage"
      - "crl:manage"
    PLANT_SECURITY_OFFICER:
      - "rag:query"
      - "rag:reindex_global"
      - "sovereignty:tamper_read"
      - "users:manage"
      - "crl:manage"
    PROCESS_LEAD:
      - "rag:query"
      - "deliverables:export"
      - "models:swap_engine"
    HSE_AUDITOR:
      - "rag:query"
      - "deliverables:export"
      - "sovereignty:tamper_read"
    MAINTENANCE_ENG:
      - "rag:query"
      - "deliverables:export"
    FIELD_OPERATOR:
      - "rag:query"
    READONLY_OPERATOR:
      - "rag:query"
    admin:
      - "rag:query"
      - "rag:reindex_global"
      - "sandbox:override_ast"
      - "deliverables:export"
      - "sovereignty:tamper_read"
      - "models:swap_engine"
      - "users:manage"
      - "crl:manage"
    operator:
      - "rag:query"

database:
  sqlite_path: "data/users_auth.db"
