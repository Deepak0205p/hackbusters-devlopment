# Model Registry Configuration for Sovereign Industrial AI Workbench (SIH26117)
# Extensible YAML definition for on-premise open-weight models

version: "1.0.0"
default_primary_model: "qwen3-4b"
default_general_model: "llama-3.2-3b"

models:
  - id: "qwen3-4b"
    name: "Qwen 3 4B"
    role: "Deep Reasoning & Planning Engine"
    quantization: "GGUF Q4_K_M"
    vram_footprint_gb: 2.8
    context_window_tokens: 8192
    serving_provider: "ollama"
    ollama_model_tag: "qwen3:4b-q4_k_m"
    task_types:
      - "reasoning"
      - "planning"
      - "policy_evaluation"
      - "approval_note_drafting"
      - "complex_synthesis"
    temperature: 0.2
    top_p: 0.9
    is_primary: true

  - id: "qwen2.5-coder-3b"
    name: "Qwen 2.5 Coder 3B"
    role: "Code Generation & Engineering Math Specialist"
    quantization: "GGUF Q4_K_M"
    vram_footprint_gb: 2.0
    context_window_tokens: 8192
    serving_provider: "ollama"
    ollama_model_tag: "qwen2.5-coder:3b-q4_k_m"
    task_types:
      - "coding"
      - "python_scripting"
      - "engineering_calculation"
      - "error_traceback_debugging"
      - "data_transformation"
    temperature: 0.1
    top_p: 0.95
    is_primary: false

  - id: "qwen2-vl-2b"
    name: "Qwen2-VL 2B"
    role: "Multimodal Vision & Diagram Specialist"
    quantization: "GGUF Q4_K_M"
    vram_footprint_gb: 2.0
    context_window_tokens: 4096
    serving_provider: "ollama"
    ollama_model_tag: "qwen2-vl:2b-q4_k_m"
    task_types:
      - "vision"
      - "ocr_supplementation"
      - "pid_diagram_analysis"
      - "scanned_inspection_pdf"
      - "equipment_photo_inspection"
    temperature: 0.2
    top_p: 0.9
    is_primary: false

  - id: "llama-3.2-3b"
    name: "Llama 3.2 3B"
    role: "General Conversational Assistant"
    quantization: "GGUF Q4_K_M"
    vram_footprint_gb: 2.0
    context_window_tokens: 8192
    serving_provider: "ollama"
    ollama_model_tag: "llama3.2:3b-q4_k_m"
    task_types:
      - "general"
      - "conversational_qa"
      - "text_formatting"
      - "brief_summary"
    temperature: 0.4
    top_p: 0.9
    is_primary: false

# Memory Management Guidelines
vram_management:
  max_concurrent_models_gpu: 2
  gpu_memory_ceiling_gb: 6.0
  reserved_system_vram_gb: 0.5
  reserved_kv_cache_gb: 0.7
  eviction_policy: "LRU" # Least Recently Used (preserves primary reasoning model if active)
  model_swap_timeout_seconds: 5.0
